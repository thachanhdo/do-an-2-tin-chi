apiVersion: v1
kind: Namespace
metadata:
  name: trial1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shop-dongho-data
  namespace: trial1
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-dongho
  namespace: trial1
  labels:
    app: shop-dongho
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-dongho
  template:
    metadata:
      labels:
        app: shop-dongho
    spec:
      nodeSelector:
        kubernetes.io/hostname: trial1
      initContainers:
        - name: init-dirs
          image: python:3.11-slim
          command:
            [
              "sh",
              "-c",
              "mkdir -p /mnt/data /mnt/media && chown -R 1000:1000 /mnt",
            ]
          volumeMounts:
            - name: storage
              mountPath: /mnt
      containers:
        - name: shop-dongho
          image: shop-dongho:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_ALLOWED_HOSTS
              value: "dongho.hmz.one"
            - name: DJANGO_DEBUG
              value: "False"
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shop-secrets
                  key: django-secret-key
          volumeMounts:
            - name: storage
              mountPath: /app/data
              subPath: data
            - name: storage
              mountPath: /app/media
              subPath: media
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: shop-dongho-data
---
apiVersion: v1
kind: Service
metadata:
  name: shop-dongho-svc
  namespace: trial1
spec:
  selector:
    app: shop-dongho
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-dongho-ingress
  namespace: trial1
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: dongho.hmz.one
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop-dongho-svc
                port:
                  number: 80
